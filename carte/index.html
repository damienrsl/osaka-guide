 var toks=String(p.gare||'').split(/[\/(+]/).map(function(s){return norm(s).replace(/^\s*(ou|et)\s+/,'').replace(/[^a-z0-9\- ]/g,'').trim()}).filter(Boolean);
 for(var i=0;i<MAISON_PUB.trajets.length;i++){var t=MAISON_PUB.trajets[i];var noms=[];String(t[0]).split(/[()]/).forEach(function(s){s=norm(s).trim();if(s){noms.push(s);noms.push(s.replace(/ station$/,''))}});
  noms=noms.map(nk);if(toks.some(function(k){return noms.indexOf(nk(k))>-1}))return t}
 return null}
function marcheVers(g){var gs=(MAISON_PUB&&MAISON_PUB.gares)||[];for(var i=0;i<gs.length;i++){if(gs[i][0]===g)return gs[i][1]}return maison&&maison.marche}
function blocDepuis(p){
 if(!maison)return '<div class="tk-dep"><strong>Depuis le logement</strong><span>Réglez votre logement (bouton « Logement ») pour voir la distance et le trajet.</span></div>';
 var km=distKm(maison.lat,maison.lon,p.lat,p.lon);
 var h='<div class="tk-dep"><strong>Depuis '+esc(maison.court||maison.nom)+'</strong><div>'+fmtKm(km)+' km à vol d’oiseau</div>';
 var t=trajetPour(p);
 if(t){var dep=t[5]||MAISON_PUB.gare,mar=marcheVers(dep);h+='<div class="tk-tr">'+(mar?esc(mar)+' min à pied jusqu’à '+esc(dep)+', puis ':'')+'<b>'+esc(t[1])+' min</b> <span class="tk-tr2">'+esc(t[2])+' → '+esc(t[0])+(t[6]?' · '+esc(t[6])+' ¥':'')+'</span> '+srcTr(t)+'</div>'}
 h+='<a class="tk-btn gm" href="https://www.google.com/maps/dir/?api=1&origin='+maison.lat+','+maison.lon+'&destination='+p.lat+','+p.lon+'&travelmode=transit" target="_blank" rel="noopener noreferrer">Itinéraire en transports ↗</a></div>';
 return h}
var fiche=document.getElementById('tk-fiche');
function ouvrir(p,deplacer){
 sel=p.id;panneau='lieu';var t=TH[p.theme]||TH.autre;

 var h='<div class="tk-fiche-tete" style="--c:'+t.c+'"><button class="tk-x" type="button" aria-label="Fermer la fiche">×</button><div class="tk-th">'+esc(t.n)+(p.sous_theme?' · '+esc(p.sous_theme):'')+' · '+esc(p.quartier)+(p.g?' · ★ pépite':'')+'</div><h3>'+esc(p.nom)+'</h3>'+(p.nom_jp?'<div class="tk-jp">'+esc(p.nom_jp)+'</div>':'')+'</div><div class="tk-corps">';
 h+='<div class="tk-metro"><strong>Gare et sortie</strong><div class="tk-sortie">'+esc(p.gare||'—')+(p.sortie?' · '+esc(p.sortie):'')+'</div>'+(p.ligne?'<div>'+esc(p.ligne)+'</div>':'')+'</div>';
 h+=blocDepuis(p);
 h+='<dl class="tk-info">'+ligneInfo('Adresse',p.adresse)+ligneInfo('Horaires',p.horaires)+ligneInfo('Prix',p.prix)+ligneInfo('Fort en',p.fort)+ligneInfo('Budget',GAMMES[p.gamme])+ligneInfo('Tax-free',p.tax_free===true?'oui':p.tax_free===false?'non':'')+ligneInfo('Grandes tailles',p.taille_grande)+ligneInfo('Réserver',p.reservation)+'</dl>';
 if(p.description)h+='<div>'+esc(p.description)+'</div>';
 if(p.attente||p.realite)h+='<div class="tk-av">'+(p.attente?'<div class="a"><b>Ce qu’on attend</b>'+esc(p.attente)+'</div>':'')+(p.realite?'<div class="r"><b>La réalité '+note+'</b>'+esc(p.realite)+'</div>':'')+'</div>';
 if(p.conseil)h+='<div><b>Conseil :</b> '+esc(p.conseil)+'</div>';
 h+='<div class="tk-liens">'+(urlOk(p.url_source)?'<a class="tk-btn src" href="'+esc(p.url_source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'<a class="tk-btn gm" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lon+'" target="_blank" rel="noopener noreferrer">Google Maps ↗</a></div>';
 if(p.a_verifier&&p.a_verifier.length)h+='<div class="tk-av2">À vérifier sur place : '+esc(p.a_verifier.join(' ; '))+'</div>';
 h+='</div>';
 fiche.innerHTML=h;fiche.style.setProperty('--c',t.c);fiche.scrollTop=0;fiche.classList.add('ouverte');
 fiche.querySelector('.tk-x').onclick=fermer;
 document.getElementById('tk-aide').style.opacity=0;
 var z=deplacer?Math.max(map.getZoom(),ZOOM_PINS+1):map.getZoom();var sz=map.getSize(),mob=window.innerWidth<=700;var cx=mob?sz.x/2:(sz.x-400)/2,cy=mob?sz.y*0.22:sz.y/2;
 var c=map.unproject(map.project([p.lat,p.lon],z).subtract([cx-sz.x/2,cy-sz.y/2]),z);map.flyTo(c,z,{duration:deplacer?.8:.5});
 try{history.replaceState(null,'','#lieu='+encodeURIComponent(p.id))}catch(e){}
 rendre(false);
}
function fermer(){sel=null;panneau='';placer=false;fiche.classList.remove('ouverte');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}rendre(false)}
/* le logement : marqueur, panneau, changement d'adresse */
function majMaison(){
 if(maisonM){map.removeLayer(maisonM);maisonM=null}
 var b=document.getElementById('tk-maison-btn');
 if(maison){maisonM=L.marker([maison.lat,maison.lon],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:'<div class="tk-maison" title="'+esc(maison.nom)+'"><i></i><em>Logement</em></div>'}),title:maison.nom,alt:'Notre logement',keyboard:true,zIndexOffset:5000}).addTo(map);maisonM.on('click',function(){ouvrirMaison()});
  b.textContent='Logement · '+(maison.court||maison.nom);b.setAttribute('aria-pressed','true')}
 else{b.textContent='Logement : à régler';b.setAttribute('aria-pressed','false')}
}
function setMaison(o){maison=o;lsSet('osk-maison',o);majMaison();if(o)map.flyTo([o.lat,o.lon],Math.max(map.getZoom(),13),{duration:.6});ouvrirMaison()}
function geocoder(q,cb){
 if(!window.fetch){cb('Recherche impossible ici : placez le point sur la carte.');return}
 fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=fr&viewbox=135.30,34.85,135.70,34.50&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
  if(j&&j[0]&&isFinite(+j[0].lat))cb(null,{lat:+(+j[0].lat).toFixed(6),lon:+(+j[0].lon).toFixed(6),nom:q,periode:'',court:'',marche:null,adresse:j[0].display_name||'',adresse_jp:''});
  else cb('Adresse introuvable. Essayez le nom de l’hôtel ou du quartier, ou placez le point sur la carte.')
 }).catch(function(){cb('Pas de réseau pour chercher l’adresse : placez le point sur la carte.')})}
function taxi(){
 if(!maison||!maison.adresse_jp)return;sel=null;panneau='taxi';
 var h='<div class="tk-fiche-tete" style="--c:#0b0f24"><button class="tk-x" type="button" aria-label="Fermer">×</button><div class="tk-th">À montrer au chauffeur</div><h3>この住所までお願いします</h3><div class="tk-jp">« Jusqu’à cette adresse, s’il vous plaît »</div></div><div class="tk-corps"><div class="tk-taxi">'+esc(maison.adresse_jp)+'</div><button class="tk-btn sec" id="tk-taxi-cp" type="button">Copier l’adresse</button><div class="tk-msg" id="tk-msg2"></div></div>';
 fiche.innerHTML=h;fiche.scrollTop=0;fiche.classList.add('ouverte');fiche.querySelector('.tk-x').onclick=fermer;
 document.getElementById('tk-taxi-cp').onclick=function(){var m=document.getElementById('tk-msg2');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(maison.adresse_jp).then(function(){m.textContent='Adresse copiée.'},function(){m.textContent=maison.adresse_jp});else m.textContent=maison.adresse_jp};
}
function ouvrirMaison(){
 sel=null;panneau='maison';rendre(false);
 var h='<div class="tk-fiche-tete" style="--c:#0b0f24"><button class="tk-x" type="button" aria-label="Fermer">×</button><div class="tk-th">Point de départ</div><h3>'+(maison?esc(maison.nom):'Logement à régler')+'</h3>'+(maison&&maison.periode?'<div class="tk-jp">'+esc(maison.periode)+'</div>':'')+'</div><div class="tk-corps">';
 if(maison){
  if(maison.adresse||maison.adresse_jp)h+='<dl class="tk-info">'+ligneInfo('Adresse',maison.adresse)+ligneInfo('En japonais',maison.adresse_jp)+'</dl>';
  if(maison.court&&MAISON_PUB&&maison.court===MAISON_PUB.court&&MAISON_PUB.trajets&&MAISON_PUB.trajets.length){
   h+='<div class="tk-metro"><strong>Les gares à pied</strong>'+(MAISON_PUB.gares||[]).map(function(g){return '<div class="tk-tr">'+esc(g[0])+' : <b>'+esc(g[1])+' min</b> <span class="tk-tr2">'+esc(g[2]||'')+'</span></div>'}).join('')+'</div>';
   h+='<details class="tk-det"><summary>Les trajets vers '+MAISON_PUB.trajets.length+' gares</summary>'+MAISON_PUB.trajets.slice().sort(function(a,b){return a[1]-b[1]}).map(function(t){return '<div class="tk-tr">'+esc(t[0])+' : <b>'+esc(t[1])+' min</b> <span class="tk-tr2">'+esc(t[2])+(t[5]?' · depuis '+esc(t[5]):'')+'</span> '+srcTr(t)+'</div>'}).join('')+'</details>'}
  if(maison.adresse_jp)h+='<button class="tk-btn src tk-taxi-b" id="tk-taxi" type="button">Montrer l’adresse au taxi</button>';
  h+='<a class="tk-btn gm" href="https://www.google.com/maps/dir/?api=1&destination='+maison.lat+','+maison.lon+'&travelmode=transit" target="_blank" rel="noopener noreferrer">Rentrer : itinéraire depuis ma position ↗</a>';
  h+='<div class="tk-liens"><a class="tk-btn gm" href="https://www.google.com/maps/search/?api=1&query='+maison.lat+','+maison.lon+'" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><button class="tk-btn sec" id="tk-copier" type="button">Copier le lien avec le logement</button></div>';
 }else h+='<div>L’adresse du logement n’est pas écrite dans la page : elle arrive par le lien partagé, ou se règle ici. Elle reste dans ce navigateur.</div>';
 h+='<div class="tk-sous">'+(maison?'Changer de logement':'Régler le logement')+'</div><div class="tk-form"><input class="tk-champ" id="tk-adr" type="text" placeholder="Adresse ou nom de l’hôtel" aria-label="Adresse du logement"><button class="tk-btn src" id="tk-chercher" type="button">Chercher</button><button class="tk-btn sec" id="tk-placer" type="button">Placer sur la carte</button>'+(maison?'<button class="tk-btn sec" id="tk-effacer" type="button">Effacer</button>':'')+'</div><div class="tk-msg" id="tk-msg" aria-live="polite"></div></div>';
 fiche.innerHTML=h;fiche.style.setProperty('--c','#0b0f24');fiche.scrollTop=0;fiche.classList.add('ouverte');
 fiche.querySelector('.tk-x').onclick=fermer;
 var msg=document.getElementById('tk-msg');
 var tx=document.getElementById('tk-taxi');if(tx)tx.onclick=taxi;
 var cp=document.getElementById('tk-copier');if(cp)cp.onclick=function(){var l=lienMaison();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(function(){msg.textContent='Lien copié : il ouvre la carte avec ce logement.'},function(){msg.textContent=l});else msg.textContent=l};
 var adr=document.getElementById('tk-adr'),ch=document.getElementById('tk-chercher');
 ch.onclick=function(){var q=adr.value.trim();if(!q){msg.textContent='Tapez une adresse ou un nom d’hôtel.';return}msg.textContent='Recherche…';geocoder(q,function(err,o){if(err){msg.textContent=err;return}setMaison(o)})};
 adr.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();ch.click()}};
 document.getElementById('tk-placer').onclick=function(){placer=true;fiche.classList.remove('ouverte');var a=document.getElementById('tk-aide');a.textContent='Touchez la carte à l’endroit du logement';a.style.opacity=1};
 var ef=document.getElementById('tk-effacer');if(ef)ef.onclick=function(){setMaison(null)};
 document.getElementById('tk-aide').style.opacity=0;
}
document.getElementById('tk-maison-btn').onclick=function(){if(panneau==='maison')fermer();else ouvrirMaison()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(sel||panneau))fermer()});
map.on('click',function(e){if(placer){placer=false;var a=document.getElementById('tk-aide');a.textContent='Touchez une bulle de quartier pour zoomer, un point pour sa fiche';setMaison({lat:+e.latlng.lat.toFixed(6),lon:+e.latlng.lng.toFixed(6),nom:'Logement (placé sur la carte)',periode:'',court:'',marche:null,adresse:'',adresse_jp:''});return}if(sel||panneau)fermer()});
map.on('zoomend',function(){rendre(false)});
/* molette : seulement après un clic sur la carte, pour ne pas bloquer le défilement de la page */
map.on('focus',function(){map.scrollWheelZoom.enable()});map.on('blur',function(){map.scrollWheelZoom.disable()});
majMaison();
if(maison&&!L.latLngBounds(VUE).contains([maison.lat,maison.lon])&&MODE!=='guide-autour')map.fitBounds(L.latLngBounds(VUE).extend([maison.lat,maison.lon]),{padding:[24,24]});
rendre(true);
/* lien direct #lieu=id */
var H1=lireHash();if(H1.lieu){var p0=byId(H1.lieu);if(p0){map.setView([p0.lat,p0.lon],16);ouvrir(p0,false)}}
/* ajustement à l'affichage dans une page qui scrolle */
setTimeout(function(){map.invalidateSize()},300);window.addEventListener('load',function(){map.invalidateSize()});
/* boutons : plein écran + me situer */
var cadre=root.querySelector('.tk-cadre'),repere=document.createComment('tk-cadre'),plein=false;
var IC_PLEIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
var IC_SORTIR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var IC_AUTOUR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8"/></svg>';
var IC_MOI='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.5l7.2 2.3L12.5 20z"/></svg>';
var Ctl=L.Control.extend({options:{position:'topright'},onAdd:function(){var d=L.DomUtil.create('div','tk-ctl');d.innerHTML='<button type="button" id="tk-plein-btn"></button><button type="button" id="tk-moi-btn" aria-label="Me situer sur la carte" title="Me situer">'+IC_MOI+'</button><button type="button" id="tk-autour-btn" aria-label="Les lieux les plus proches">'+IC_AUTOUR+'Autour</button>';L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d}});
map.addControl(new Ctl());
var pBtn=document.getElementById('tk-plein-btn'),moiBtn=document.getElementById('tk-moi-btn');
function majPlein(){pBtn.innerHTML=plein?IC_SORTIR+'Fermer':IC_PLEIN+'Plein écran';pBtn.setAttribute('aria-label',plein?'Quitter le plein écran':'Afficher la carte en plein écran');pBtn.classList.toggle('on',plein)}
function setPlein(on){
 if(on===plein)return;plein=on;var c=map.getCenter(),z=map.getZoom();
 if(on){cadre.parentNode.insertBefore(repere,cadre);document.body.appendChild(cadre);cadre.classList.add('tk-carte','tk-plein');document.documentElement.classList.add('tk-sans-defil');map.dragging.enable();map.scrollWheelZoom.enable()}
 else{cadre.classList.remove('tk-carte','tk-plein');if(repere.parentNode){repere.parentNode.insertBefore(cadre,repere);repere.parentNode.removeChild(repere)}document.documentElement.classList.remove('tk-sans-defil');if(L.Browser.mobile)map.dragging.disable();map.scrollWheelZoom.disable()}
 majPlein();map.invalidateSize();map.setView(c,z,{animate:false});setTimeout(function(){map.invalidateSize()},80);
}
pBtn.onclick=function(){setPlein(!plein)};majPlein();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&plein&&!sel&&!panneau)setPlein(false)});
var AIDE0=document.getElementById('tk-aide').textContent,aideT=null;
function dire(t){var a=document.getElementById('tk-aide');a.textContent=t;a.style.opacity=1;clearTimeout(aideT);aideT=setTimeout(function(){a.style.opacity=0;setTimeout(function(){a.textContent=AIDE0},450)},5000)}
var moiM=null,moiC=null,suivi=false,centrer=false;
moiBtn.onclick=function(){
 if(!navigator.geolocation){dire('Localisation indisponible sur ce navigateur');return}
 if(moiM){map.flyTo(moiM.getLatLng(),Math.max(map.getZoom(),16),{duration:.6});return}
 centrer=true;dire('Recherche de votre position…');
 if(!suivi){suivi=true;moiBtn.classList.add('on');map.locate({watch:true,enableHighAccuracy:true,setView:false})}
};
map.on('locationfound',function(e){
 if(!moiM){moiC=L.circle(e.latlng,{radius:e.accuracy,color:'#1a73e8',weight:1,fillOpacity:.12,interactive:false}).addTo(map);moiM=L.marker(e.latlng,{icon:L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],html:'<div class="tk-moi"></div>'}),interactive:false,keyboard:false,zIndexOffset:6000}).addTo(map)}
 else{moiM.setLatLng(e.latlng);moiC.setLatLng(e.latlng).setRadius(e.accuracy)}
 if(centrer){centrer=false;if(map.options.maxBounds&&!L.latLngBounds(map.options.maxBounds).contains(e.latlng))dire('Vous êtes hors de la zone de la carte');else{map.flyTo(e.latlng,Math.max(map.getZoom(),16),{duration:.8});dire('Le point bleu, c’est vous')}}
});
map.on('locationerror',function(e){suivi=false;centrer=false;moiBtn.classList.remove('on');map.stopLocate();dire(e.code===1?'Localisation refusée : Réglages › Confidentialité › Service de localisation › Safari':'Position introuvable pour l’instant, réessayez')});
function ouvrirAutour(){
 var o,quoi;
 if(moiM){var ll=moiM.getLatLng();o=[ll.lat,ll.lng];quoi='Autour de vous'}
 else if(maison){o=[maison.lat,maison.lon];quoi='Autour du logement'}
 else{var c=map.getCenter();o=[c.lat,c.lng];quoi='Autour du centre de la carte'}
 var ps=visibles().map(function(p){return {p:p,d:distKm(o[0],o[1],p.lat,p.lon)}}).sort(function(a,b){return a.d-b.d}).slice(0,15);
 sel=null;panneau='autour';
 var h='<div class="tk-fiche-tete" style="--c:#2436b8"><button class="tk-x" type="button" aria-label="Fermer">×</button><div class="tk-th">'+(gratinOn?'Les pépites':'Les lieux')+' les plus proches</div><h3>'+quoi+'</h3>'+(!moiM?'<div class="tk-jp">Touchez la flèche « me situer » pour partir de votre position</div>':'')+'</div><div class="tk-corps tk-autour">';
 if(!ps.length)h+='<div>Aucun lieu avec ces filtres.</div>';
 ps.forEach(function(x){var p=x.p,t=TH[p.theme]||TH.autre,m=Math.max(1,Math.round(x.d*1000*1.3/80));
  h+='<button type="button" class="tk-proche" data-id="'+esc(p.id)+'" style="--c:'+t.c+'"><i></i><span><b>'+esc(p.nom)+(p.g?' ★':'')+'</b><small>'+esc(t.n)+' · '+esc(p.quartier)+'</small></span><em>'+(x.d<2.5?'≈ '+m+' min à pied':fmtKm(x.d)+' km')+'</em></button>'});
 h+='<div class="tk-av2">Minutes à pied estimées : distance à vol d’oiseau × 1,3, à 80 m par minute.</div></div>';
 fiche.innerHTML=h;fiche.style.setProperty('--c','#2436b8');fiche.scrollTop=0;fiche.classList.add('ouverte');
 fiche.querySelector('.tk-x').onclick=fermer;
 Array.prototype.forEach.call(fiche.querySelectorAll('.tk-proche'),function(b){b.onclick=function(){var p=byId(b.dataset.id);if(p)ouvrir(p,true)}});
 document.getElementById('tk-aide').style.opacity=0;rendre(false);
}
document.getElementById('tk-autour-btn').onclick=function(){if(panneau==='autour')fermer();else ouvrirAutour()};
window.osakaCarte={taxi:taxi,trajetGare:function(g){return trajetPour({gare:g})},marcheVers:marcheVers,map:map,plein:setPlein,ouvrir:function(id){var p=byId(id);if(p)ouvrir(p,true)},lieux:LIEUX,maison:function(){return maison},setMaison:setMaison};
})();
